<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>maimai CiRCLE B50</title>
    <style>
        :root {
            --circle-teal: #00f2ff;
            --circle-pink: #ff66cc;
            /* Difficulty Colors */
            --color-basic: #22bb5b;
            --color-advanced: #fb9c2d;
            --color-expert: #f64861;
            --color-master: #9e49e2;
            --color-remaster: #e2e2e2;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Ubuntu", "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 2000px;
            height: 1125px; /* Matches your 16:9 background ratio */
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            background-image: url('background/Background_Maimai_DX_CiRCLE.png'); /* Ensure your background is here */
            background-size: cover;
            background-position: center;
            position: relative;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* Header Styling */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
            margin-bottom: 10px;
            padding: 0 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            border-left: 5px solid var(--circle-teal);
        }

        .player-info h1 {
            margin: 0;
            color: #fff;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .rating-box {
            color: #fff;
            font-weight: 900;
            font-size: 32px;
            font-style: italic;
            text-shadow: 0 0 10px var(--circle-teal);
        }

        /* Section Titles */
        .section-header {
            display: flex;
            align-items: center;
            color: white;
            font-size: 14px;
            margin: 5px 0;
            text-shadow: 1px 1px 2px #000;
        }

        .section-header span {
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 10px;
            border-radius: 20px;
            margin-right: 10px;
        }

        /* The Grid */
        .song-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr); /* 7x5 for Best 35 */
            gap: 6px;
        }

        .new-grid {
            grid-template-columns: repeat(5, 1fr); /* 5x3 for Best 15 */
        }

        /* Individual Song Card */
        .song-card {
            height: 55px; /* Compact height to fit 50 songs */
            display: flex;
            border-radius: 4px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }

        .jacket {
            width: 55px;
            height: 55px;
            background-size: cover;
            flex-shrink: 0;
        }

        .content {
            flex-grow: 1;
            padding: 2px 5px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }

        .title {
            font-size: 9px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 90px;
        }

        .achievement {
            font-size: 14px;
            font-weight: 900;
            color: #ffcc00;
            font-style: italic;
        }

        .meta {
            font-size: 8px;
            color: #ddd;
            display: flex;
            justify-content: space-between;
        }

        /* Difficulty Tags */
        .diff-tag {
            position: absolute;
            top: 0;
            right: 0;
            width: 4px;
            height: 100%;
        }

        .BASIC { background: var(--color-basic); }
        .ADVANCED { background: var(--color-advanced); }
        .EXPERT { background: var(--color-expert); }
        .MASTER { background: var(--color-master); }
        .RE-MASTER { background: var(--color-remaster); }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="player-info">
            <h1>{{ player_name }}</h1>
        </div>
        <div class="rating-box">
            Rating: {{ player_rating }}
        </div>
    </div>

    <div class="section-header">
        <span>Best 35 (Old)</span>
    </div>
    <div class="song-grid">
        {% for song in best35 %}
        <div class="song-card">
            <div class="jacket" style="background-image: url('{{ song.img }}');"></div>
            <div class="content">
                <div class="title">{{ song.title }}</div>
                <div class="achievement">{{ song.achievement_text }}</div>
                <div class="meta">
                    <span>{{ song.rating }}</span>
                </div>
            </div>
            <div class="diff-tag {{ song.difficulty }}"></div>
        </div>
        {% endfor %}
    </div>

    <div class="section-header" style="margin-top: 15px;">
        <span>Best 15 (New)</span>
    </div>
    <div class="song-grid new-grid">
        {% for song in best15 %}
        <div class="song-card">
            <div class="jacket" style="background-image: url('{{ song.img }}');"></div>
            <div class="content">
                <div class="title">{{ song.title }}</div>
                <div class="achievement">{{ song.achievement_text }}</div>
                <div class="meta">
                    <span>{{ song.rating }}</span>
                </div>
            </div>
            <div class="diff-tag {{ song.difficulty }}"></div>
        </div>
        {% endfor %}
    </div>
</div>

</body>
</html>
